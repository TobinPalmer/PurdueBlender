<script>window.initialAppState = {"institution":null,"coverPhoto":{"id":113732,"imageId":"600d89f9-110d-402b-bf93-193c97c583c5","imagePath":"","url":"https://se-images-blob.campuslabs.com/communities/34/coverphotos/600d89f9-110d-402b-bf93-193c97c583c5.jpg","thumbnailUrl":"https://se-images-blob.campuslabs.com/communities/34/coverphotos/600d89f9-110d-402b-bf93-193c97c583c5-thumbnail.jpg","caption":"PMU","dateCreated":"2019-06-06T16:45:53.657-04:00","institutionId":34},"user":null,"preFetchedData":{"event":null,"loadAdditionalEventDetails":false,"organization":{"id":24846,"communityId":115,"institutionId":34,"name":"Pi Kappa Phi","shortName":"Pi Kapps","nameSortKey":"P","websiteKey":"pikappaphi","email":"archon@purduepikapps.com","description":"<p style=\"text-align: center;\"><em><strong>We Will Lead</strong></em></p>\r\n<p>Founded on Nov. 24, 1922, the Omega Chapter of Pi Kappa Phi boasts one of the best locations on Purdue&rsquo;s campus.&nbsp; Located directly across from Grissom Hall, it is an incredibly short walk to nearly all resources on campus. &nbsp;The chapter stands on a strong moral and spiritual base and are looking for strong young men interesting in being leaders of their peers and others on campus.</p>\r\n<p>&nbsp;</p>\r\n<p><strong>Character </strong></p>\r\n<p>The men of Omega are recruited and built to be men of high character and integrity. The fraternity offers many opportunities to better each member as a brother of Pi Kappa Phi, as a student, and as a citizen.&nbsp;&nbsp;&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p><strong>Leadership</strong></p>\r\n<p>We are Leaders by Choice.&nbsp; The Omega Chapter has built consistent leaders over the years.&nbsp; Each member is expected to be involved in at least one organization outside of Pi Kappa Phi.&nbsp; We have had a member hold a position on organizations such as the Interfraternity Council Executive Board, Old Masters, College Mentors for Kids, Order of Omega, Boiler Gold Rush, Gimlet Honorary and many other organizations and honoraries. &nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p><strong>Academics</strong></p>\r\n<p>We are at Purdue to receive an education.&nbsp; The Omega Chapter consistently ranks above the all fraternity average for GPA, as well as the Purdue mens' average. &nbsp;We are proud of the 9 members that received a perfect 4.0 last semester.&nbsp;</p>\r\n<p><strong>Service</strong></p>\r\n<p>We are dedicated to service.&nbsp; In 1977, Pi Kappa Phi was the first &ndash; and remains the only &ndash; national fraternity to create its own philanthropic organization, Push America.&nbsp; Push America is an outreach program to raise money and awareness for those with disabilities.&nbsp; In the past 2 years, the Omega chapter has built three wheelchair ramps for local residents in a partnership with Push America.&nbsp; The Pi Kapp 100 is a 100km bike ride that the members of the Omega chapter participate in to raise money for Push America.&nbsp; Pi Kappa Phi holds a national cross-country bike ride called the Journey of Hope every summer to raise awareness and money for people with disabilities.&nbsp; The Omega Chapter proudly had a member participate in the life changing ride in 2007 and we&rsquo;ve had 10 since its inception.&nbsp; In each of last 6 years, Pi Kappa Phi has been the top fund raising chapter at Purdue. In 2008, we raised more than $12,000 for Push America.&nbsp;&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p><strong>Sportsmanship</strong></p>\r\n<p>For the past 3 years the fraternity has placed in the Top 3 in all-fraternity intramurals.&nbsp; The chapter won 3 team championships and 6 individual championships.&nbsp; Pi Kappa Phi prides itself in the support that is given through intramurals.&nbsp; When going to a football game, the sideline will be packed with fellow brothers supporting their team.&nbsp; &nbsp; We pride ourselves on the balance that we can create in the chapter.</p>","summary":"We Will Lead\r\nFounded on Nov. 24, 1922, the Omega Chapter of Pi Kappa Phi boasts one of the best locations on Purdue's campus.  Located directly across from Grissom Hall, it is an incredibly short walk to nearly all resources on ","status":"Active","comment":null,"showJoin":false,"statusChangeDateTime":"2026-06-25T10:43:56-04:00","startDate":"1969-12-31T00:00:00-05:00","endDate":null,"parentId":77161,"wallId":null,"discussionId":31436,"groupTypeId":null,"organizationTypeId":607,"cssConfigurationId":null,"deleted":false,"enableGoogleCalendar":false,"modifiedOn":"2016-09-19T16:41:15-04:00","socialMedia":{"externalWebsite":"http://www.purduepikapps.com/","flickrUrl":"","googleCalendarUrl":"","googlePlusUrl":"","instagramUrl":"https://www.instagram.com/purduepikapps","linkedInUrl":"","pinterestUrl":"","tumblrUrl":"","vimeoUrl":"","youtubeUrl":"","facebookUrl":null,"twitterUrl":null,"twitterUserName":null},"profilePicture":"46381954-5fc1-4270-bb05-cb58bbee0d1887ce6d9e-159f-4add-b4eb-1fb32b62697a.png","organizationType":{"id":607,"branchId":77161,"name":"Fraternity, Sorority, Cooperative","autoApproveRequests":false,"showMembersToPublic":false,"showOfficersToPublic":false,"showMembersToLoggedInUsersByDefault":false,"showOfficersToLoggedInUsersByDefault":true,"eventsEnabled":true,"serviceHoursEnabled":true,"financeEnabled":true,"financeRequestsEnabled":true,"fundingRequestsEnabled":true,"purchaseRequestsEnabled":true,"budgetingEnabled":true,"budgetingRequestsEnabled":true,"reRegistrationAvailabilty":null,"electionsEnabled":true,"formsEnabled":true,"galleryEnabled":true,"outcomesEnabled":true,"rosterEnabled":true,"shownInPublicDirectory":true,"documentsEnabled":true,"isSystemType":false,"adminOnly":false,"isClosed":false},"primaryContactId":{"communityMemberId":43811438,"accountId":"7133e78a-9715-4c43-986d-91bc531e7216","campusEmail":"Bstanovi@purdue.edu"},"primaryContact":{"id":"7133e78a-9715-4c43-986d-91bc531e7216","firstName":"Brayden","preferredFirstName":null,"lastName":"Stanovich","primaryEmailAddress":"Bstanovi@purdue.edu","profileImageF
