<!-- 
    ============================================
    HENNI'S HAIRSHOP - HOMEPAGE
    ============================================
    
    This is the main landing page for Henni's Hairshop.
    
    LAST UPDATED: 2025-07-03
    
    NOTES:
    - This is a static HTML file with minimal JavaScript
    - All styling is handled by assets/css/styles.css
    - JavaScript functionality is in assets/js/main.js
    - Images are stored in assets/images/
    - For any content updates, modify the HTML directly below
    - For style changes, edit the CSS file
    ============================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Henni's Hairshop - Your trusted hair care experts near Purdue University">
    
    <!-- Page Title -->
    <title>Henni's Hairshop - Home</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/hennishairshop-icon.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/hennishairshop-icon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- 
        MAIN HEADER SECTION
        Contains the site logo and main navigation.
        The header is fixed at the top of the page on all screen sizes.
    -->
    <header>
        <div class="container">
            <!-- Logo - Clicking returns to homepage -->
            <div class="logo">
                <a href="/" aria-label="Return to Homepage">
                    <img src="assets/images/hennishairshop-logo.png" alt="Henni's Hairshop Logo" style="max-height: 60px;">
                </a>
            </div>
            
            <!-- Main Navigation -->
            <nav>
                <ul>
                    <li><a href="/" class="nav-link active">Home</a></li>
                    <li><a href="about/" class="nav-link">About</a></li>
                    <li><a href="contact/" class="nav-link">Contact</a></li>
                    <li><a href="https://hennishairshop.bookedby.com/" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Book Now</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 
        MAIN CONTENT AREA
        Contains the primary content of the page.
        The padding-top ensures content isn't hidden behind the fixed header.
    -->
    <main>
        <!-- Hero Section - Main call-to-action area -->
        <section class="hero">
            <div class="container">
                <h1>Welcome to Henni's Hairshop</h1>
                <p>Your trusted hair care experts near Purdue University</p>
                <!-- Primary Call-to-Action Button -->
                <a href="https://hennishairshop.bookedby.com/" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Book an Appointment</a>
            </div>
        </section>
        
        <!-- Additional sections can be added here as needed -->
    </main>

    <!-- 
        FOOTER SECTION
        Contains copyright information and other footer content.
        The year is automatically updated via JavaScript.
    -->
    <footer>
        <div class="container">
            <p>&copy; <span id="current-year">2025</span> Henni's Hairshop. All rights reserved.</p>
            <!-- 
                YEAR UPDATE NOTE:
                The year is automatically updated by JavaScript in assets/js/main.js
                No need to manually update it here.
            -->
        </div>
    </footer>

    <!-- 
        JAVASCRIPT FILES
        - main.js: Handles dynamic elements like the copyright year update
        - Add any additional scripts before the closing body tag
    -->
    <script src="assets/js/main.js"></script>
</body>
</html>
