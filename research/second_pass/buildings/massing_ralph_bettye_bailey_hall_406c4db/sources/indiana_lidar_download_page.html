<!DOCTYPE html>
<html>
	<head>
		<title>LiDAR data download</title>
		<meta charset="utf-8" />
		<link rel="stylesheet" type="text/css" href="/css/style.css">
		<link rel="stylesheet" href="/css/leaflet-panel-layers.src.css" />
		<link rel="stylesheet" href="/css/leaflet.css" />
		<link rel="stylesheet" type="text/css" href="/css/jquery-ui.css">
		<link rel="stylesheet" type="text/css" href="/js/Leaflet.markercluster-1.4.1/dist/MarkerCluster.css">
		<link rel="stylesheet" type="text/css" href="/js/Leaflet.markercluster-1.4.1/dist/MarkerCluster.Default.css">
		<link rel="stylesheet" type="text/css" href="/css/leaflet.draw.css">

		<style>
			body { margin:0; padding:0; }
			#map { position:absolute; top:0; bottom:0; width:100%; }
		</style>

		<script src="/js/leaflet.js"></script>
		<script src="/js/jquery.min.js"></script>
		<script src="/js/leaflet-panel-layers.js"></script>
		<script src="/js/jquery-ui.min.js"></script>
		<script src="/js/leaflet.ajax.js"></script>
		<script src="/js/Leaflet.markercluster-1.4.1/dist/leaflet.markercluster.js"></script>
		<script src="/js/map.js"></script>
		<script src="/js/leaflet.draw.js"></script>

		<!-- Global site tag (gtag.js) - Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-74661870-3"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());

			gtag('config', 'UA-74661870-3');
		</script>

		<script src="/js/marker-main.js"></script>
		<script>
			$(document).ready(function(){
				//map.addLayer(projectMarkers);
				map.addLayer(markers);

				projectMarkers.on('clustermouseover', function (e) {
					ShowClusterPopup(e.originalEvent);
				});

				projectMarkers.on('clustermouseout', function (e) {
					$("#cluster-popup").hide();
					isClusterPopupShow = false;

				});

				projectMarkers.on('clusterclick', function (e) {
					$("#cluster-popup").hide();
					isClusterPopupShow = false;

				});

				// GetProjectList();
				// GetPointcloudList();

				$("#project-search").on('keyup',function () {
					$("#project-list li").each(function(){
						var filter = $("#project-search").val().toUpperCase();
						if ($(this).text().toUpperCase().indexOf(filter) > -1) {
							$(this).show();
						} else {
							$(this).hide();
						}
					});

				});

				$("#pointcloud-search").on('keyup',function () {
					$("#pointcloud-list li").each(function(){
						var filter = $("#pointcloud-search").val().toUpperCase();
						if ($(this).text().toUpperCase().indexOf(filter) > -1) {
							$(this).show();
						} else {
							$(this).hide();
						}
					});

				});

			});


		</script>

		<!-- Piwik -->
		<!-- <script type="text/javascript" src="/js/piwik.js"></script> -->
		<!-- End Piwik Code -->
	</head>
	<body>
		<div id="cluster-popup" class="cluster-popup">Click to expand</div>
		<div id="map"></div>

		<script>
			var map = L.map('map', {
				center: [40.42720, -86.91005],
				zoom: 11,
				minZoom: 1,
				maxZoom: 17,
			});

			var years_str = "2017to2020";
			var years = years_str.split(",");
			var years_int = new Array(years.length);
			var i;
			for (i=0; i<years.length; i++) {
				years_int[i] = parseInt(years[i], 10);
			}

			var county_name = "tippecanoe";

			var osm_map = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
				attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
				zIndex: 0
			});

			var googleHybrid = L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',{
    		maxZoom: 20,
    		subdomains:['mt0','mt1','mt2','mt3']
			});

			map.attributionControl.addAttribution('Powered by <a href="https://gdslab.org" target="_blank">GDSL@Purdue</a>');

			map.addLayer(googleHybrid);

			//------------------------------Adding drawing/editing control-------------------------------------
				var drawnItems = new L.FeatureGroup();
				map.addLayer(drawnItems);

				// Initialise the draw control and pass it the FeatureGroup of editable layers
				var drawControl = new L.Control.Draw({
					edit: {
						featureGroup: drawnItems,

						polygon: {
							allowIntersection : false
						}

					},
					draw: {

						polygon : {
							allowIntersection: false,
							guidelineDistance: 2
						},
						circle: false, // Turns off this drawing tool

						polyline: false,
						marker: false
					}
				});
				map.addControl(drawControl);
				//-----------------------------------------------------------------------------------------------

				map.on('draw:created', function (e) {
					var type = e.layerType,
						layer = e.layer;
						layer.on('click', function() {
							UnSelectAll();
							layer.setStyle({dashArray: "8,6"});

							var jsondata = layer.toGeoJSON();

							$('#geojson').val(JSON.stringify(jsondata));
							CheckCalculateConditions();
						});

					drawnItems.addLayer(layer);

				});

				map.on('click', function(){
					UnSelectAll();
				});


			map.createPane('county');
			map.createPane('tile');

			map.getPane('county').style.zIndex = 600;
			map.getPane('tile').style.zIndex = 601;

			// Styles
			var boundaryStyle = {
						"color": "#0078ff",
						"weight": 1,
						"fillOpacity": 0,
						"opacity": 1.0,
					};

			var countyStyle = {
						"color": "#ff7800",
						"weight": 2,
						"fillOpacity": 0,
						"opacity": 1.0,
					};

			var gridStyle = {
						"color": "#0000ff",
						"weight": 1,
						"fillOpacity": 0,
						"opacity": 1.0,
					};

			var county_boundary = new L.GeoJSON.AJAX("/gis_layers/in_counties_with_lidar_year.geojson",
					{onEachFeature:county_popUp,
					style: countyStyle,
					pane: "county"});

			var tile_boundary = new L.GeoJSON.AJAX("/gis_layers/tilemap_tippecanoe.geojson",
					{onEachFeature:boundary_popUp,
						style: boundaryStyle,
						pane: "tile"});


			var ndhm1 = L.tileLayer('http://lidar.digitalforestry.org/xyz/tippecanoe/'+years_int[0].toString()+'/ndhm/{z}/{x}/{y}.png', {tms: false, zIndex: 60, opacity: 1.0});
			var dem1 = L.tileLayer('http://lidar.digitalforestry.org/xyz/tippecanoe/'+years_int[0].toString()+'/dem/{z}/{x}/{y}.png', {tms: false, zIndex: 50, opacity: 1.0});
			var ndhm2 = L.tileLayer('http://lidar.digitalforestry.org/xyz/tippecanoe/'+years_int[1].toString()+'/ndhm/{z}/{x}/{y}.png', {tms: false, zIndex: 80, opacity: 1.0});
			var dem2 = L.tileLayer('http://lidar.digitalforestry.org/xyz/tippecanoe/'+years_int[1].toString()+'/dem/{z}/{x}/{y}.png', {tms: false, zIndex: 70, opacity: 1.0});

			var baseLayers = [
				{
					name: "Open Street Map",
					layer: osm_map
				},
				{
					name: "Satellite Map",
					layer: googleHybrid
				},
			];

			var overLayers = [
				{
					group: "GIS",
					layers: [
						{
							name: "Counties",
							active: "true",
							layer: county_boundary,
						},
						{
							name: "Tiles",
							active: "true",
							layer: tile_boundary,
						}
					]
				},

				{
					group: "LiDAR ('11-'13)",
					layers: [
						{
							name: "DTM",
							layer: dem1,
						},
						{
							name: "NDHM",
							layer: ndhm1,
						}
					]
				},

				{
					group: "LiDAR ('17-'20)",
					layers: [
						{
							name: "DTM",
							layer: dem2,
						},
						{
							name: "NDHM",
							layer: ndhm2,
						}
					]
				},

			]

			var panelLayers = new L.Control.PanelLayers(baseLayers, overLayers, {collapsibleGroups: true});
			map.addControl(panelLayers);

			tile_boundary.addTo(map);
			county_boundary.addTo(map);

			//Add legends (the later a legend is added the higher priority it has)
			//AddLegend("ndhm");

			function county_popUp(f,l) {
				var out = [];
				if (f.properties) {
					for (key in f.properties) {
						if (key == 'NAME_L') {
							out.push("<b>" + f.properties[key] + " county</b>");
							var county_name = f.properties[key];
						}

						if (key == 'lidar_year') {
							var years = f.properties[key];
						}
					}

					// console.log(l._bounds);

					// Calculate center of boundary
					var swlat = l._bounds._southWest['lat'];
					var swlon = l._bounds._southWest['lng'];
					var nelat = l._bounds._northEast['lat'];
					var nelon = l._bounds._northEast['lng'];

					var clon = (swlon + nelon) / 2.0;
					var clat = (swlat + nelat) / 2.0;

					out.push("<br>");

					if (county_name == 'Marion') {
						out.push("<a href=/download_marion.php?cname=" + county_name.split(' ').join('').toLowerCase() + "&clon=" + clon + "&clat=" + clat + "&years=" + years + ">LiDAR data download </a>");
					} else {
						out.push("<a href=/download.php?cname=" + county_name.split(' ').join('').toLowerCase() + "&clon=" + clon + "&clat=" + clat + "&years=" + years + ">LiDAR data download </a>");
					}

					l.bindPopup(out.join("<br />"));

					l.bindTooltip(f.properties['NAME_L'], {permanent: false, sticky: true, opacity: 0.7});
				}
			}

			function boundary_popUp(f,l) {
				// console.log(f.properties);
				var out = [];
				out.push("<b>LiDAR Tile Download</b>");

				if (f.properties) {
					for (key in f.properties) {

						if (key == 'Area') {
							continue;
						}
						if (key == 'AREA') {
							continue;
						}

						var fname = f.properties[key];
						// out.push(key+": "+f.properties[key]);

						// if (key == 'FeatCode') {
						// 	var fname = "MC_" + f.properties[key];
						// }

						if (key == 'TILENUM') {
							var fname = f.properties[key];
						}
					}
					var tile_name = fname.split("_")[1];
					var i;
					for (i=0; i<years_int.length; i++) {
						var year = years_int[i];
						if (year > 2015 && year < 2021) {
							out.push("<br>");
							// out.push("<b></b>")
							out.push("<b>" + year + " Indiana LiDAR Data</b>")
							out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/tippecanoe/las/" + fname + ".las>Point cloud download </a>")
							out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/tippecanoe/dsm/" + fname + "_dsm.tif>DSM download </a>")
							// if (county_name == 'marion'){
							// 	out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/tippecanoe/dtm/" + 'DEM_' + fname + ".tif>DTM (TIF) download </a>")
							// 	out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/tippecanoe/dtm/" + 'DEM_' + fname + ".tfw>DTM (TFW) download </a>")
							// } else {
							out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/tippecanoe/dtm/" + fname + ".img>DTM download </a>")
							// }
							out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/tippecanoe/ndhm/" + fname + "_ndhm.tif>NDHM download </a>")
						} else {
							out.push("<br>");
							out.push("<b>" + year + " Indiana LiDAR Data</b>")
							out.push("<a href=/state/" + year + "/las/in"+ year + "_" + tile_name + "_12.las>Point cloud download </a>")

							out.push("<a href=/QL2_3DEP_LiDAR_IN_2011_2013_l2/tippecanoe/dsm/in" + year + "_" + tile_name + "_12_dsm.tif>DSM download </a>")
							// https://lidar.digitalforestry.org/QL2_3DEP_LiDAR_IN_2011_2013_l2/tippecanoe/dsm/in2013_30151895_12.tif
							// /home/oh231/igic/QL2_3DEP_LiDAR_IN_2011_2013_l2/adams/dsm


							out.push("<a href=/state/" + year + "/dem/in"+ year + "_" + tile_name + "_12.img>DTM download </a>")
							out.push("<a href=/state/" + year + "/geotiff/in"+ year + "_" + tile_name + "_12.tif>Ortho download </a>")
						}

					}
					// out.push("<br>");
					// out.push("<b>2017 - 2019 Indiana LiDAR Data</b>")
					// out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_laz/" + fname + ".laz>Point cloud download </a>")
					// out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/" + fname + "_dsm.tif>DSM download </a>")
					// out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/" + fname + "_dtm.img>DTM download </a>")
					// out.push("<a href=/QL2_3DEP_LiDAR_IN_2017_2019_l2/" + fname + "_ndhm.tif>NDHM download </a>")
					l.bindPopup(out.join("<br />"));
				}
			}

		</script>
	</body>
</html>
