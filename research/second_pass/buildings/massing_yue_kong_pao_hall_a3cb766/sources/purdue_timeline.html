 Purdue saw its greatest enrollment growth &amp;ndash; from 5,628 to 25,582 students. Its annual budget increased from $12.7 million to $136 million. While he was president, Purdue established the schools of industrial engineering, materials engineering, technology and veterinary medicine. In 1975, the Purdue Executive Building was renamed the Frederick L. Hovde Hall of Administration in his honor.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/Hovde.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Frederick L. Hovde&quot;,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1946&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:57},&quot;tags&quot;:[{&quot;id&quot;:8,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:57,&quot;tag_id&quot;:8}}]},{&quot;id&quot;:305,&quot;year&quot;:&quot;1946&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue is forced to turn down 5,000 registrants for the fall semester due to a lack of classrooms and housing facilities.&quot;,&quot;description&quot;:&quot;Campus overcrowding became a serious problem as veterans returned to campus after the War, many taking advantage of the G.I. Bill. Enrollment nearly tripled, and facilities, many of which had been minimally repaired and maintained during war years, were unprepared for this dramatic growth. Temporary housing erected on campus helped alleviate housing problems, to some degree. According to the 1947 Debris, students lived in attics and basements of some buildings, and faculty stayed in rooms in the Union, while some fraternities &amp;ldquo;acquired Quonset huts to take care of their returned G.I.&amp;rsquo;s&amp;rdquo;.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:&quot;(A Century and Beyond, pg. 255),  (Debris 1947, pg. 20)&quot;,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1946&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:305},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:305,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:306,&quot;year&quot;:&quot;1947&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Creative Arts Buildings and the Aerospace Science Laboratory are completed.&quot;,&quot;description&quot;:null,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1947&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:306},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:306,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:382,&quot;year&quot;:&quot;1947&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue desegregates student housing, allowing African American students to be housed in campus dormitories.&quot;,&quot;description&quot;:&quot;&lt;div&gt;For African-American students on campus, the 1940s was a time of growing dissent and hard-won gains in status. Young men who had fought for the rights of others during the war came back to face limited rights imposed by segregation.&lt;\/div&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1947&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:382},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:382,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:58,&quot;year&quot;:&quot;1947&quot;,&quot;month&quot;:&quot;02&quot;,&quot;day&quot;:&quot;24&quot;,&quot;title&quot;:&quot;The &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/bleacher%20collapse\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;bleachers in the Purdue Field House collapse&lt;\/a&gt;&amp;nbsp;during the Purdue-Wisconsin&amp;nbsp;basketball game, killing three students and injuring nearly 300.&quot;,&quot;description&quot;:&quot;Purdue fans rose from their seats to give &amp;ldquo;a tremendous ovation&amp;rdquo; when the half ended with a score of 43-33 over league-leading Wisconsin. As the players left the floor, a support in the east stands cracked. &amp;ldquo;With an accordion-like motion, the stands, with some 4,000 students on them, tilted forward and with a great rumble sank to the floor, pinning many beneath the wooden planks and splintered beams,&amp;rdquo; stated the 1947 Debris yearbook. Improvised stretchers were created for the injured as they awaited transport to the area hospitals. An alarm went out over radio seeking help in transporting the injured to the hospitals, and vehicles from all over Lafayette, including bread trucks, buses, ambulances, and hearses responded. Three Purdue students - Roger Gelhausen, William Feldman, and Ted Nordquist - died as a result of the accident.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1947bleachers.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Bleacher Collapse&quot;,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;February 24, 1947&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:58},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:58,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:61,&quot;year&quot;:&quot;1950&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=meredith%20hall&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=cary&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings&amp;amp;t=a\&quot;&gt;Meredith Residence Hall&lt;\/a&gt; is built, signaling the beginning of Purdue&#039;s ambitious, multimillion-dollar construction program that greatly changed the appearance of campus in the 1950s.&quot;,&quot;description&quot;:&quot;To meet the needs of the rapidly increasing student population, the university constructed multiple new residence halls, including Virginia C. Meredith Hall in 1950, &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/harrison%20court!south%20campus%20courts\/field\/all!all\/mode\/all!all\/conn\/or!or\/order\/nosort\&quot;&gt;Harrison Court&lt;\/a&gt; (later South Campus Courts) in 1952, &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/owen%20hall!1951-99999999\/field\/all!date\/mode\/all!exact\/conn\/and!and\/order\/nosort\&quot;&gt;Richard Owen Hall&lt;\/a&gt; in 1955, &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/state%20street%20court!fowler%20court\/field\/all!all\/mode\/all!all\/conn\/or!or\/\&quot;&gt;State Street Courts&lt;\/a&gt; (later renamed Fowler Courts) in 1955, &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/wiley%20hall!1950-99999999\/field\/all!date\/mode\/all!exact\/conn\/and!and\/order\/nosort\&quot;&gt;Harvey W. Wiley Hall&lt;\/a&gt; in 1956, &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/1950-99999999!tarkington%20hall\/field\/date!all\/mode\/exact!all\/conn\/and!and\/order\/nosort\/ad\/asc\&quot;&gt;Newton Booth Tarkington Hall&lt;\/a&gt; in 1956, and &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/1950-99999999!terry%20courts\/field\/date!all\/mode\/exact!all\/conn\/and!and\/order\/nosort\/ad\/asc\&quot;&gt;Terry Courts&lt;\/a&gt; in 1956. The &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/collection\/ag-ed!epurdue!earhart!bcc!bot!cl!ua25!debris!msa291!theses!engext!AESAgSciDig!AES_AR!AESBulletin!AESCircular!AESecon!AESclsum!AESCrops!AESLeaflet!AESMimeo4H!AESMimeoAE!AESMimeoAS!AESMimeoAY!AESmimeoBP!AESMimeoDH!AESmimeoE!AESMimeoF!AESMimeoFNR!AESMimeoHE!AESmimeoHO!AESMimeoP!AESMimeoS!AESpinney!AESPIH!AESpar!AESSwineDay!AESsiff!AESspcirc!gilbreth!msp224!gwinter!gougar!inbridge!ifarm!IndHist!msa284!kmag!msa327!msa129!msp194!psyc!pbuildings!psd!ua9!puhistphot!php!ppharmacist!PPA!prc!scrapbooks!pustudents!pada!pualumni!puath!msp255!pufaculty!ua8!pulibraries!pnewsreels!mso2!oralhist!msp35!SVMreport!twinpines\/searchterm\/purdue%20village!married%20student%20housing\/field\/all!all\/mode\/all!all\/conn\/or!and\/order\/nosort\&quot;&gt;Purdue Village&lt;\/a&gt;, or Married Student Housing, was first built in 1956 and expanded twice during the 1960s.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/MeredithHall.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Meredith Residence Halls&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1950&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:61},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:61,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:64,&quot;year&quot;:&quot;1950&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The men living in campus dormitories compete in the first annual tricycle race.&quot;,&quot;description&quot;:&quot;In the early days the race started at the front steps of the Memorial Union and the racers were dressed as young children. Later, the race was in Cary Quad and between the units. It was called the Cary Club Tricycle Race and lasted two hours and about two hundred and twenty to two hundred and fifty laps. In the first five laps a standard tricycle was used and then the racers switched to modified trikes. Onlookers threw water at the racers and after the race the tricycles were donated to a charity.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/PurdueTricycleRace1958.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Purdue&amp;apos;s first annual tricycle race!&quot;,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1950&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:64},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:64,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:390,&quot;year&quot;:&quot;1950&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Fraternities, sororities, dorms, and co-ops compete annually in the &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/homecoming%20sign%20contest\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;Homecoming Sign Contest&lt;\/a&gt;.&quot;,&quot;description&quot;:&quot;The &amp;ldquo;signs&amp;rdquo; consisted of elaborate decorations on the lawns of the residences that tied in some way to the football game. Early versions of the competition began in the 1910s, but the 1950s saw it reach a peak of elaborate and creative designs. Judging was based on &amp;ldquo;originality, slogan, neatness, and day and night effects&amp;rdquo; with an emphasis on &amp;ldquo;appropriateness and good taste.&amp;rdquo; The winner of each division was announced during halftime of the Homecoming game and awarded a trophy. The annual competition continued until the 1970s.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1950&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:390},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:390,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:392,&quot;year&quot;:&quot;1950&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Commander Richard L. Duncan, U.S. Navy, is awarded the first Ph.D. in the School of Aeronautical Engineering.&quot;,&quot;description&quot;:&quot;He was advised by Maurice Zucrow, the first person to receive a Ph.D. in any field at Purdue.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,& ive recruiting effort for black students, and to require integration of all extracurricular activities as well as fraternities and sororities &amp;lsquo;in practice as well as in policy.&amp;rsquo;&amp;rdquo; Their demands were not met.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1964&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:405},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:405,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:70,&quot;year&quot;:&quot;1966&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=harrison%20hall&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;Benjamin Harrison Hall&lt;\/a&gt; is completed.&quot;,&quot;description&quot;:&quot;Enrollment continued to rise through the 1960s, creating a need for more residences on campus. John T. McCutcheon Hall (1963), Amelia Earhart Hall (1964), and Eleanor B. Shreve Hall (1970) expanded options for undergraduate students. Ernest C. Young Hall, originally named the Graduate House when built in 1962, was the first housing unit designated specifically for graduate students, followed in 1966 by George A. Hawkins Hall.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/HarrisonHall.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Harrison Hall&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1966&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:70},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:70,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:321,&quot;year&quot;:&quot;1967&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Astronaut alumni&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=grissom&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=virgil%20gus&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;Virgil \&quot;Gus\&quot; Grissom&lt;\/a&gt;&amp;nbsp;and&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=roger%20chaffee&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;Roger Chaffee&lt;\/a&gt;&amp;nbsp;die during a preflight test of Apollo I.&quot;,&quot;description&quot;:&quot;The Purdue community mourned the tragic loss of astronaut alumni Grissom and Chaffee in the Apollo 1 fire. In response to their death, the university memorialized both men. Within weeks of the tragedy, Purdue declared that the Civil Engineering Building would be renamed Virgil I. Grissom Hall and a recently opened office building at the Jet Propulsion Center would be called Roger B. Chaffee Hall. Both buildings were formally dedicated in memory of their namesakes in ceremonies during Gala Week in May of 1968.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1967&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:321},&quot;tags&quot;:[{&quot;id&quot;:3,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:321,&quot;tag_id&quot;:3}}]},{&quot;id&quot;:402,&quot;year&quot;:&quot;1967&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings\/searchterm\/purdue%20university%20arena!mackey%20arena\/field\/all!all\/mode\/all!all\/conn\/or!and\/order\/nosort\/ad\/asc\&quot;&gt;Purdue University Arena&lt;\/a&gt;&amp;nbsp;(later known as Mackey Arena) is completed.&quot;,&quot;description&quot;:&quot;Construction began on the new basketball arena in 1965 and was completed in 1967. The new facility, renamed Guy J. Mackey Arena in 1971, held a seating capacity of 14,416 at the time of its dedication. The first game played in the new arena was against Purdue alumnus John R. Wooden and his UCLA Bruins. Purdue lost 73-71.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/pbuildings&amp;CISOPTR=12&amp;DMSCALE=204.77815699659&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Mackey Arena, aerial view&quot;,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:&quot;pbuildings&quot;,&quot;archive_id&quot;:&quot;12&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1967&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:402},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:402,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:71,&quot;year&quot;:&quot;1967&quot;,&quot;month&quot;:&quot;01&quot;,&quot;day&quot;:&quot;02&quot;,&quot;title&quot;:&quot;Purdue defeats the University of Southern California at the&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=rose%20bowl%201967&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;Rose Bowl&lt;\/a&gt;&amp;nbsp;- their first bowl game appearance.&quot;,&quot;description&quot;:&quot;&lt;div&gt;Approximately 4,000 students, 700 faculty and staff, and thousands of alumni made the trek to California, including about 2,000 students who were part of the university&amp;rsquo;s official &amp;ldquo;student tour.&amp;rdquo; &lt;span style=\&quot;font-size: 1rem;\&quot;&gt;The Purdue Band traveled across the country by train, including a freight car for the big bass drum. They stopped along the way in Denver, Salt Lake City, and Las Vegas. In Las Vegas, the band practiced parading, apparently causing a spectacle. According to newpaper headlines,&lt;\/span&gt;&amp;nbsp;the only thing that had ever called the gamblers away from the slot machines was the Purdue band marching up and down the street. When the day of the game arrived, Purdue&amp;rsquo;s team was ready. The Boilermakers and the Trojans faced off through four tense quarters and in the end, Purdue won a 14-13 victory over the USC Trojans.&amp;nbsp;About 150 students participating in the &amp;ldquo;student tour&amp;rdquo; made an unplanned overnight visit to Las Vegas when their plane made an emergency landing due to engine trouble. The students spent the night, where the university covered their expenses and, according to the Exponent, &amp;ldquo;many won enough money to make the delay a profitable one.&amp;rdquo; The 1967 Rose Bowl festivities focused not only on football, but also on one of Purdue&amp;rsquo;s most illustrious groups of alumni: astronauts. The Tournament of Roses Parade was themed &amp;ldquo;Travel Tales in Flowers&amp;rdquo; and Purdue&amp;rsquo;s float represented Purdue as the &amp;ldquo;Alma Mater of Astronauts.&amp;rdquo; Neil Armstrong, Gene Cernan, Roger Chaffee, and Virgil &amp;ldquo;Gus&amp;rdquo; Grissom appeared in the parade and attended the football game. Each astronaut also received a Rose Bowl football signed by the Purdue team.&lt;\/div&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/PurdueRoseBowlVictory1967.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Purdue&#039;s Rose Bowl victory in 1967&quot;,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;January 2, 1967&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:71},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:71,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:407,&quot;year&quot;:&quot;1968&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;Helen Bass Williams becomes the first African American professor at Purdue University.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Williams taught French in the Languages Department and was a counselor in the School of Humanities, Social Science, and Education. She was active in the Civil Rights Movement and was an important guiding figure for many black students at Purdue. Williams was involved in the establishment of the Black Cultural Center, Black Faculty and Staff Council, the Black Studies program, and other curricular and extracurricular groups.&lt;\/p&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-12-10 20:08:26&quot;,&quot;formatted_date&quot;:&quot;1968&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:407},&quot;tags&quot;:[{&quot;id&quot;:74,&quot;tag&quot;:&quot;Women in higher education&quot;,&quot;created_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;updated_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:407,&quot;tag_id&quot;:74}},{&quot;id&quot;:75,&quot;tag&quot;:&quot;Women Faculty&quot;,&quot;created_at&quot;:&quot;2024-10-21 15:07:26&quot;,&quot;updated_at&quot;:&quot;2024-10-21 15:07:26&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:407,&quot;tag_id&quot;:75}}]},{&quot;id&quot;:406,&quot;year&quot;:&quot;1968&quot;,&quot;month&quot;:&quot;10&quot;,&quot;day&quot;:&quot;23&quot;,&quot;title&quot;:&quot;The editor of The Exponent, William Smoot, is removed from his position for allowing language deemed innappropriate for a campus publication.&quot;,&quot;description&quot;:&quot;During the 1960s, the Exponent, a consistent presence on campus for 80 years, became entangled in the political turmoil on campus. Articles and editorials in the newspaper became increasingly political, drawing ire and praise from students. Competing editorials regarding student activities, university administration, and world events filled columns of the paper in every issue. The tensions came to a head in October 1968. The recurring column &amp;ldquo;Notes from a Black Book,&amp;rdquo; written by married students Paul and Deborah Cabbell, took aim at what they called President Hovde&amp;rsquo;s &amp;ldquo;tyrannical administration&amp;rdquo; and called for his removal from office using language which lead to the removal of editor William Smoot. The Exponent ceased print for a brief time as the staff supported their exiled leader. Smoot was reinstated following additional support from students and faculty. As a result of this matter, the complicated administration of the Exponent was clarified by removing it from university oversight entirely and establishing The Purdue Student Publishing Association.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;October 23, 1968&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:406},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:406,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:397,&quot;year&quot;:&quot;1969&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Purdue Grand Prix moves to a specially built track north of the stadium on the corner of Northwestern Avenue and Cherry Lane.&quot;,&quot;description&quot;:&quot;The track was modeled after the World Kart Championship track in Japan. By this time, the karts had engines designed for kart racing, with speeds approaching 70 miles per hour.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1969&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:397},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:397,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:403,&quot;year&quot;:&quot;1969&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Boilermakers make their first appearance in an NCAA Men&amp;rsquo;s Basketball Championship game.&quot;,&quot;description&quot;:&quot;The team defeated Miami University (Ohio), Marquette University, and the University of North Carolina on their way to the championship. The Boilermakers, led by star players Rick Mount, Billy Keller, and Herm Gilliam, again faced Coach Wooden and the Bruins in the March 22, 1969, championship game. Purdue fell 92-72, as the tournament&amp;rsquo;s most outstanding player, Lew Alcindor, scored 37 points and gathered 20 rebounds.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/17nfoVNKSQJTNhHeh79wDfpySy1OgJqdntxmODdG.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1969&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:403},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:403,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:322,&quot;year&quot;:&quot;1969&quot;,&quot;month&quot;:&quot;05&quot;,&quot;day&quot;:&quot;05&quot;,&quot;title&quot;:&quot;A sit-in at the&amp;nbsp;Purdue Memorial Union in protest of rising tuition and fees&amp;nbsp;ends in the arrest of over 200 students.&quot;,&quot;description&quot;:&quot;The sit-in ended in the early hours of the following morning as more than 200 students who refused to vacate the building were arrested, held, booked, and released without bond. Their cases never went to trial. The following day, the day of Purdue&amp;rsquo;s centennial celebrations, hundreds of students marched to the Administration Building to protest the arrests of the previous night. They surrounded the entrance to the building and at the peak of the protest, nearly 800 students filled the first floor. The protestors dispersed following threat of arrest and the use of mace by state troopers monitoring the situation outside the building.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;May 5, 1969&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:322},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:322,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:72,&quot;year&quot;:&quot;1969&quot;,&quot;month&quot;:&quot;05&quot;,&quot;day&quot;:&quot;06&quot;,&quot;title&quot;:&quot;Purdue celebrates its 100th anniversary.&quot;,&quot;description&quot;:&quot;&lt;div&gt;Many activities were planned to mark the occasion, including banquets, lectures, publications, and a special Centennial Year Capital Gift Campaign to contribute to the ongoing growth of campus. The university utilized a special centennial year logo on all centennial-related stationery and publications, including official proclamations marking the anniversary.&amp;nbsp;In honor of the centennial, Purdue commissioned a redesign of the university seal. The new seal, designed by Visual Arts Professor Al Gowan, modernized the seal and shifted its focus from a literal illustration of Purdue&amp;rsquo;s areas of expertise to an embodiment of Purdue&amp;rsquo;s values. The new logo appeared on a centennial flag taken to space by Neil Armstrong and later presented to Purdue by Armstrong in 1970.&lt;\/div&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1969-seal-b.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Current Seal&quot;,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;May 6, 1969&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:72},&quot;tags&quot;:[{&quot;id&quot;:2,&quot;tag&quot;:&quot;Administration&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:72,&quot;tag_id&quot;:2}}]},{&quot;id&quot;:404,&quot;year&quot;:&quot;1969&quot;,&quot;month&quot;:&quot;07&quot;,&quot;day&quot;:&quot;21&quot;,&quot;title&quot;:&quot;Purdue alumnus&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/neil%20armstrong\/field\/all\/mode\/all\/conn\/and\/order\/date\/page\/1\&quot;&gt;Neil Armstrong&lt;\/a&gt; becomes the first person to walk on the moon during the Apollo 11 mission.&quot;,&quot;description&quot;:&quot;Purdue celebrated the moon landing not only as an accomplishment &amp;ldquo;for all mankind&amp;rdquo; but also for the alumnus who became legend. The State of Indiana and the university recognized &amp;ldquo;Apollo 11 Day&amp;rdquo; on July 21.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;July 21, 1969&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:404},&quot;tags&quot;:[{&quot;id&quot;:3,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:404,&quot;tag_id&quot;:3}}]},{&quot;id&quot;:73,&quot;year&quot;:&quot;1970&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/Freehafer%20Hall\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;Freehafer Hall&lt;\/a&gt; and the &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=Heine%20Pharmacy&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot&amp;amp;t=a\&quot;&gt;Heine Pharmacy&lt;\/a&gt;&amp;nbsp;are completed.&quot;,&quot;description&quot;:&quot;Freehafer Hall, the new six-story Pharmacy building, brought together all School of Pharmacy faculty into one facility for the first time since World War II.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/HeinePharmacy.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Heine Pharmacy&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1970&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:73},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:73,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:411,&quot;year&quot;:&quot;1970&quot;,&quot;month&quot;:&quot;01&quot;,&quot;day&quot;:null,&quot;title&quot;:&quot;Astronaut alumnus&amp;nbsp;&lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/searchterm\/neil%20armstrong\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;Neil Armstrong&lt;\/a&gt; visits Purdue&#039;s campus.&quot;,&quot;description&quot;:&quot;Armstrong received an honorary doctorate of engineering from President Hovde at commencement ceremonies and in return, Armstrong presented a Purdue centennial flag to the University&amp;nbsp;that he carried with him to the moon. Following in the tradition established by alumni astronauts Gus Grissom, Roger Chaffee, and Neil Armstrong, two future astronauts graduated in this decade: Jerry Ross, the first human to be launched into space seven times, in 1970 (Bachelor&#039;s) and 1972 (Master&#039;s) and Janice Voss, Purdue&amp;rsquo;s first woman astronaut alumna, in 1975.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/pualumni&amp;CISOPTR=28&amp;DMSCALE=197.04433497537&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Armstrong receives honorary doctorate of engineering&quot;,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;archive_collection&quot;:&quot;pualumni&quot;,&quot;archive_id&quot;:&quot;28&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;January 1970&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:411},&quot;tags&quot;:[{&quot;id&quot;:3,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:411,&quot;tag_id&quot;:3}}]},{&quot;id&quot;:323,&quot;year&quot;:&quot;1970&quot;,&quot;month&quot;:&quot;12&quot;,&quot;day&quot;:&quot;04&quot;,&quot;title&quot;:&quot;The first&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings!puhistphot!pnewsreels!puath!debris!pualumni!psd!pufaculty!pada!php\/searchterm\/black%20cultural%20center\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;Black Cultural Center&lt;\/a&gt;&amp;nbsp;is dedicated.&quot;,&quot;description&quot;:&quot;&lt;div&gt;The new Black Cultural Center (BCC) offered a location for both learning and community building.&amp;nbsp;&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;Professor&lt;\/span&gt;&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;&amp;nbsp;&lt;\/span&gt;&lt;a style=\&quot;font-size: 1rem;\&quot; href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings!puhistphot!pnewsreels!puath!debris!pualumni!psd!pufaculty!pada!php\/searchterm\/Singer%20Buchanan\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;Singer Buchanan&lt;\/a&gt;&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;&amp;nbsp;&lt;\/span&gt;&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;was hired as Purdue&amp;rsquo;s first coordinator of Black Student Programs in 1970. He articulated a vision for the BCC as an educational and social center, a place for people of different races and backgrounds to discuss issues, exchange feelings, and &amp;ldquo;emerge hopefully on the other side with a greater understanding of what each thinks, and feels, and believes.&amp;rdquo;&lt;\/span&gt;&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;&amp;nbsp;Graduate student John Houston became the first director of the BCC in 1972. He was succeeded by Antonio Zamora in 1973. In 1999, the Black Cultural Center moved to its current location at the corner of 3rd and Russell Street.&lt;\/span&gt;&lt;\/div&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:&quot;pbuildings&quot;,&quot;archive_id&quot;:&quot;2964&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;December 4, 1970&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:323},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:323,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:74,&quot;year&quot;:&quot;1971&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=arthur%20hansen&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;Arthur G. Hansen&lt;\/a&gt; is hired to succeed&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings!puhistphot!pnewsreels!puath!debris!pualumni!psd!pufaculty!pada!php\/searchterm\/f.l.%20hovde\/field\/all\/mode\/all\/conn\/and\/cosuppress\/\&quot;&gt;President Frederick L. Hovde&lt;\/a&gt;&amp;nbsp;upon his retirement as University President.&quot;,&quot;description&quot;:&quot;Hansen, a Purdue alumnus who graduated from Purdue the year Hovde started his tenure at Purdue (1946), was appointed Hovde&amp;rsquo;s successor and the eighth president of the University uot;id&quot;:439,&quot;year&quot;:&quot;2012&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;The LGBTQ (Lesbian, Gay, Bisexual, Transgender, and Queer) Center opens in Schleman Hall of Student Services.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Dedicated to fostering equitable access and a discrimination-free environment, the &lt;a href=\&quot;https:\/\/archives.lib.purdue.edu\/repositories\/2\/resources\/1532\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;LGBTQ Center&lt;\/a&gt; cultivates meaningful collaborations between Purdue&#039;s LGBTQ+ community and departments, student organizations, university administration, and local community groups. Serving as a central hub, the center provides resources, community, and support, empowering LGBTQ+ students to thrive and realize their full potential at Purdue and in their journeys beyond.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/mHgT5BJOtrJ4F0PETnO770MzazjSBJCVIMqz2dWq.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Logo of Purdue LGBTQ Center&quot;,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2025-03-23 23:13:34&quot;,&quot;formatted_date&quot;:&quot;2012&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:439},&quot;tags&quot;:[{&quot;id&quot;:83,&quot;tag&quot;:&quot;Student Activism&quot;,&quot;created_at&quot;:&quot;2024-10-28 20:06:27&quot;,&quot;updated_at&quot;:&quot;2024-10-28 20:06:27&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:439,&quot;tag_id&quot;:83}},{&quot;id&quot;:89,&quot;tag&quot;:&quot;LGBTQ+ Activism&quot;,&quot;created_at&quot;:&quot;2025-07-17 15:08:37&quot;,&quot;updated_at&quot;:&quot;2025-07-17 15:08:37&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:439,&quot;tag_id&quot;:89}}]},{&quot;id&quot;:447,&quot;year&quot;:&quot;2012&quot;,&quot;month&quot;:&quot;08&quot;,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue University and the global community mourn the passing of &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/searchterm\/neil%20armstrong\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;Neil A. Armstrong&lt;\/a&gt; in 2012 and &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/searchterm\/Eugene%20Cernan\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;Eugene A. Cernan&lt;\/a&gt; in 2017.&quot;,&quot;description&quot;:&quot;Armstrong and Cernan are perhaps Purdue&#039;s most recognized alumni. Armstrong was the first man to walk on the moon and Cernan the last. Both alumni donated their personal papers to Purdue University Archives and Special Collections so that future generations of Purdue students could learn from their experiences.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;August 2012&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:447},&quot;tags&quot;:[{&quot;id&quot;:3,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:447,&quot;tag_id&quot;:3}}]},{&quot;id&quot;:423,&quot;year&quot;:&quot;2013&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Former Indiana Govenor Mitch Daniels is hired as Purdue University President, following the appointment of France A. C&amp;oacute;rdova to head the National Science Foundation.&quot;,&quot;description&quot;:&quot;&lt;div&gt;President Daniels has launched a series of initiatives called Purdue Moves that provide bold answers to some of the greatest challenges facing higher education today. The four pillars of Purdue Moves &amp;mdash; affordability and accessibility, transformative education, world-changing research, and STEM leadership &amp;mdash; leverage Purdue&amp;rsquo;s historic strengths and promote investment in new ideas, guiding the university in its mission to deliver higher education at the highest proven value. Purdue commenced a series of tuition freezes in 2013 that will last through at least the 2019-20 academic year. During that same time, room and board costs were cut by five percent and have remained steady since 2013, resulting in an overall decrease in the cost of attending Purdue since President Daniels took office that year.&lt;\/div&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/ymn7QTQgZw52szjzizccJD67ECIPvxlO9WrAYfKu.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;2013&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:423},&quot;tags&quot;:[{&quot;id&quot;:8,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:423,&quot;tag_id&quot;:8}}]},{&quot;id&quot;:436,&quot;year&quot;:&quot;2014&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Two new developments along Third Street, Third Street Suites and Krach Leadership Center, are opened.&quot;,&quot;description&quot;:&quot;Student residence Third Street Suites provides upperclassmen with another housing option near campus. The suites are designed to accomodate four students, with two bedrooms, a bathroom, and common area. The main floor houses a Starbucks and Third Street Market. Next door, the Krach Leadership Center provides numerous spaces for student groups and study areas, along with Amazon@Purdue, a brick-and-mortar location for Amazon package services.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;2014&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:436},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:436,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:440,&quot;year&quot;:&quot;2014&quot;,&quot;month&quot;:&quot;09&quot;,&quot;day&quot;:&quot;11&quot;,&quot;title&quot;:&quot;The Veterans Success Center opens as a Purdue-based resource for veterans and military students.&quot;,&quot;description&quot;:&quot;The Vetern&#039;s Success Center is housed in the Purdue Memorial Union. It is comprised of a lounge and several offices where students can receive guidance on and access to military-related education benefits, opportunities for personal and professional development, and connect with their peers.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;September 11, 2014&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:440},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:440,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:438,&quot;year&quot;:&quot;2015&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Asian American and Asian Resource and Cultural Center (AAARCC) is formed.&quot;,&quot;description&quot;:&quot;After spending a year housed in Stewart Center, the AAARCC moved into a building on 5th Street during the Fall 2016 semester. The new space, includes and Itap computer lab, exhibition space, lounge, and other social and academic spaces.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;2015&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:438},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:438,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:437,&quot;year&quot;:&quot;2016&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue&amp;rsquo;s two northern regional campuses, Purdue Calumet and Purdue North Central, merge to form Purdue Northwest.&quot;,&quot;description&quot;:&quot;In the same year, Indiana University and Purdue University announced that Indiana University-Purdue University Fort Wayne would undergo realignment and come under the management of Purdue University, which took formal effect on July 1, 2018.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;2016&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:437},&quot;tags&quot;:[{&quot;id&quot;:2,&quot;tag&quot;:&quot;Administration&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:437,&quot;tag_id&quot;:2}}]},{&quot;id&quot;:444,&quot;year&quot;:&quot;2016&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;Several Purdue alumni win medals during the 2016 Rio Olympic Games.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Alumna Amanda Elmore won a gold in rowing for the United States women\u2019s eight-person team. Elmore became the first female Purdue Olympian to win a gold and the fifth Boilermaker to win an Olympic gold medal. The men&#039;s synchronized diving team of David Boudia and Steele Johnson, both Purdue alumni, won silver medals. At the time of the 2016 Olympics, Johnson was an undergraduate at the University.&lt;\/p&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Alumni&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-10-21 14:28:51&quot;,&quot;formatted_date&quot;:&quot;2016&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:444},&quot;tags&quot;:[{&quot;id&quot;:4,&quot;tag&quot;:&quot;Alumni&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:444,&quot;tag_id&quot;:4}}]},{&quot;id&quot;:434,&quot;year&quot;:&quot;2016&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Honors College Residences are completed along Russell Street between First and Third Streets.&amp;nbsp;&quot;,&quot;description&quot;:&quot;The Honors Residences house over 800 students, along with more than 40,000 square feet of academic space, included a large lecture hall.&amp;nbsp;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;2016&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:434},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:434,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:448,&quot;year&quot;:&quot;2016&quot;,&quot;month&quot;:&quot;10&quot;,&quot;day&quot;:&quot;12&quot;,&quot;title&quot;:&quot;&lt;p&gt;Hundreds of spectators watch as the Indiana bicentennial torch relay passes through Purdue&#039;s campus.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;The torch itself was designed and manufactured at Purdue by students from the Colleges of Agriculture and Engineering. The torch relay wound its way through the state, stopping in all 92 counties. Torchbearers included Dean of Students Emerita Betty Nelson, Student Body President Geri Denger, Purdue President Mitch Daniels, Purdue astronaut alumnus David Wolf, Purdue alumnus and former football star Leroy Keyes, and many other members of the community selected by the Bicentennial Commission.&lt;\/p&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2025-04-01 14:53:31&quot;,&quot;formatted_date&quot;:&quot;October 12, 2016&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:448},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:448,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:431,&quot;year&quot;:&quot;2017&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;State Street, the central corridor through campus, is redeveloped.&quot;,&quot;description&quot;:&quot;The City of West Lafayette and Purdue University partnered to rebuild State Street, establishing new two-way traffic patterns, bike lanes, lighting, and pedestrian-friendly walkways. The project extended west to the U.S. 231\/U.S. 52 highway, connecting the growing Western Gateway to central campus. In addition, several structures in the Purdue Village were demolished as Purdue began to grow its new Innovation District, aimed at bringing in new housing and entrepreneurship opportunities to the near-west campus area adjacent Discovery Park.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;2017&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:431},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:431,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:446,&quot;year&quot;:&quot;2017&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue announces a new initiative into public university online education with the acquisition of Kaplan University.&quot;,&quot;description&quot;:&quot;&lt;div&gt;Kaplan was renamed Purdue University Global the following year. President Daniels and the Board of Trustees supported the move, and stated that it was a part of Purdue&#039;s land-grant mission to reach out to potential students who might not have the means to attend courses on one of Purdue&#039;s campuses. Purdue Student Government supported the initiative, while faculty members voiced opposition to the plan after its announcement.&lt;\/div&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot; letes, was updated to provide greater assistance to Purdue student-athletes.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;2017&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:442},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:442,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:430,&quot;year&quot;:&quot;2017&quot;,&quot;month&quot;:&quot;08&quot;,&quot;day&quot;:&quot;17&quot;,&quot;title&quot;:&quot;The Thomas S. and Harvey D. Wilmeth Active Learning Center (WALC) opens in the center of campus.&quot;,&quot;description&quot;:&quot;The WALC replaced the remains of the Heating and Power Plant as well as the Engineering Administration Building. In their place, the 170,390 square foot building created multi-faceted teaching and student learning spaces as well as housing for the Library of Engineering and Science (LOES). The LOES is made up of the former Chemistry; Earth, Atmospheric, and Planetary Sciences; Engineering; Life Sciences; Pharmacy, Nursing, and Health Sciences; and Physics Libraries.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;August 17, 2017&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:430},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:430,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:534,&quot;year
