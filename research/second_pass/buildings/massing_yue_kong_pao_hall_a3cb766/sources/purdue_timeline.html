    <timeline :events="[{&quot;id&quot;:1,&quot;year&quot;:&quot;1862&quot;,&quot;month&quot;:&quot;07&quot;,&quot;day&quot;:&quot;02&quot;,&quot;title&quot;:&quot;&lt;p&gt;President Abraham Lincoln signs the Morrill Act (Land Grant Act).&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;The Morrill Act granted each state public land, stipulating that the proceeds from the sale of this land were to be invested for use in supporting and maintaining at least one college of agriculture and the mechanical arts.&lt;\/p&gt;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/Lincoln.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Abraham Lincoln&quot;,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-01-24 18:46:36&quot;,&quot;formatted_date&quot;:&quot;July 2, 1862&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:1},&quot;tags&quot;:[{&quot;id&quot;:2,&quot;tag&quot;:&quot;Administration&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:1,&quot;tag_id&quot;:2}}]},{&quot;id&quot;:2,&quot;year&quot;:&quot;1865&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Indiana General Assembly votes to participate in the Morrill Act.&quot;,&quot;description&quot;:null,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1865capitol.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Indiana State Capitol, 1865&quot;,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1865&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:2},&quot;tags&quot;:[{&quot;id&quot;:2,&quot;tag&quot;:&quot;Administration&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:2,&quot;tag_id&quot;:2}}]},{&quot;id&quot;:364,&quot;year&quot;:&quot;1869&quot;,&quot;month&quot;:&quot;05&quot;,&quot;day&quot;:&quot;06&quot;,&quot;title&quot;:&quot;&lt;p&gt;The Indiana General Assembly Passes a Bill Establishing a School in Tippecanoe County, thus Founding Purdue University.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/CYZYenPu3Bp1uZBcV6imThZh6D8qqQOB3gxeEjmA.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2023-04-28 14:39:37&quot;,&quot;formatted_date&quot;:&quot;May 6, 1869&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:364},&quot;tags&quot;:[]},{&quot;id&quot;:3,&quot;year&quot;:&quot;1869&quot;,&quot;month&quot;:&quot;12&quot;,&quot;day&quot;:null,&quot;title&quot;:&quot;The &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=Board%20of%20Trustees&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=all&amp;amp;t=a\&quot;&gt;Board of Trustees&lt;\/a&gt; officially names the University.&quot;,&quot;description&quot;:&quot;Purdue University was named for John Purdue due to his generous donation of cash and land.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1869johnpurdue.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;John Purdue&quot;,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;December 1869&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:3},&quot;tags&quot;:[{&quot;id&quot;:2,&quot;tag&quot;:&quot;Administration&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:3,&quot;tag_id&quot;:2}}]},{&quot;id&quot;:4,&quot;year&quot;:&quot;1871&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;Ground Breaks on the First Campus Buildings&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;First buildings included the Boiler and Gas House, the Military Hall and Gymnasium,&amp;nbsp;Ladies Hall, Purdue Hall, and the Pharmacy Building - all completed by 1874. None remain today.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/TsiYGrFscKStr4RuJD3Wo1GAFofmal26IZLmarIV.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Ladies Hall&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-09-14 18:56:46&quot;,&quot;formatted_date&quot;:&quot;1871&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:4},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:4,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:5,&quot;year&quot;:&quot;1872&quot;,&quot;month&quot;:&quot;08&quot;,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;The University hires &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=Richard+Owen&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOROOT=all\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Richard Owen&lt;\/a&gt; as its first president.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;As campus had not been built yet, Owen never had an official office space. He was well regarded in the fields of geology, chemistry and medicine, and had a solid reputation as a teacher, philosopher, and Civil War soldier. Through his belief in hard work and invention, Owen brought the Morrill Act&#039;s idea of an \&quot;Indiana Agricultural College\&quot; to reality. Owen served as University President for almost two years and resigned two months before classes were scheduled to start.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/puhistphot&amp;CISOPTR=857&amp;DMSCALE=235.29411764706&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;The image is a head-and-shoulder portrait of Purdue President Richard Owen. He is wearing a suit and tie. His hair is gray.&quot;,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;archive_collection&quot;:&quot;puhistphot&quot;,&quot;archive_id&quot;:&quot;857&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-01-17 16:46:55&quot;,&quot;formatted_date&quot;:&quot;August 1872&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:5},&quot;tags&quot;:[{&quot;id&quot;:8,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:5,&quot;tag_id&quot;:8}}]},{&quot;id&quot;:6,&quot;year&quot;:&quot;1874&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=shortridge&amp;amp;CISOFIELD1=descri&amp;amp;CISOOP2=none&amp;amp;CISOBOX2=hall&amp;amp;CISOFIELD2=title&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=title&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=title&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=s\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Abraham C. Shortridge&lt;\/a&gt; is hired as the second president of Purdue.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;President Shortridge instituted a strict code of conduct, which caused conflict between the administration and the students. Students were required to keep their rooms in good order, could not keep firearms in the Dormitory, and could not smoke on campus. Those who lived on campus could not visit Lafayette in the evening without permission and were expressly forbidden to visit establishments that sold intoxicating liquors.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/th4ozZTBK7uKXxMr8QXjzeHzorsrwtDrUcfbm3mK.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-09-09 12:33:18&quot;,&quot;formatted_date&quot;:&quot;1874&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:6},&quot;tags&quot;:[{&quot;id&quot;:8,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:6,&quot;tag_id&quot;:8}}]},{&quot;id&quot;:264,&quot;year&quot;:&quot;1874&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The schools of&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=agriculture&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/psd&amp;amp;t=a\&quot;&gt;Agriculture&lt;\/a&gt;, Engineering, and Science are established. Liberal arts courses are offered through the School of Science.&quot;,&quot;description&quot;:null,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1874&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:264},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:264,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:265,&quot;year&quot;:&quot;1874&quot;,&quot;month&quot;:&quot;01&quot;,&quot;day&quot;:&quot;28&quot;,&quot;title&quot;:&quot;Purdue&#039;s first fraternity, Sigma Chi, is unofficially formed.&quot;,&quot;description&quot;:&quot;The Delta Delta Chapter of the Sigma Chi fraternity, was formed on campus with seven members. Fraternities and other secret societies were strongly discouraged by Purdue and other universities at the time. The faculty disapproved, and their disapproval was codified in the Annual Circular of 1876-77: &amp;ldquo;A regulation of the University forbids the organization of any society by the students, except by the consent of the Faculty.&amp;rdquo;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;January 28, 1874&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:265},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:265,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:7,&quot;year&quot;:&quot;1875&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;John S. Hougham becomes Interim President following the departure of President Shortridge.&quot;,&quot;description&quot;:null,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1875john.s.houghham.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;John S. Hougham&quot;,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1875&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:7},&quot;tags&quot;:[{&quot;id&quot;:8,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:7,&quot;tag_id&quot;:8}}]},{&quot;id&quot;:267,&quot;year&quot;:&quot;1875&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;Women are admitted to Purdue for the first time during the fall semester.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Eight women were admitted to the preparatory department, while one student entered the university. One year later, in the fall of 1876, six women were admitted into the university. Those who did not live locally were given rooms in the Boarding House, which became known as &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/ladies%20hall\/order\/nosort\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Ladies Hall&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-10-25 15:08:13&quot;,&quot;formatted_date&quot;:&quot;1875&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:267},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:267,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:266,&quot;year&quot;:&quot;1875&quot;,&quot;month&quot;:&quot;05&quot;,&quot;day&quot;:null,&quot;title&quot;:&quot;The first commencement is held for John Bradford Harper, Purdue&#039;s first graduate.&quot;,&quot;description&quot;:&quot;Purdue&#039;s only graduate in 1875, John Bradford Harper, earned a Chemistry degree and later became a railroad and civil engineer. (Perhaps Purdue&amp;rsquo;s first true boilermaker!) He is remembered for building canals and dams in the southwest.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Alumni&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;May 1875&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:266},&quot;tags&quot;:[{&quot;id&quot;:4,&quot;tag&quot;:&quot;Alumni&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:266,&quot;tag_id&quot;:4}}]},{&quot;id&quot;:366,&quot;year&quot;:&quot;1875&quot;,&quot;month&quot;:&quot;06&quot;,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;Purdue hires its first female faculty member, &lt;a href=\&quot;https:\/\/archives.lib.purdue.edu\/agents\/people\/3306\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Sarah Oren Haynes&lt;\/a&gt;, initially holding the title of \u201cfemale teacher of the university.\u201d&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;This title was soon rectified when she was appointed as Assistant Professor of Mathematics. In addition to being Indiana\u2019s first female state librarian and Purdue\u2019s first female faculty member, Oren was also the first faculty member, male or female, to receive a Board of Trustee\u2019s citation in appreciation of her work for the university.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/1rlFtoqFrScEkiU4dN0Yfay9JUEO2LaRag1KNukJ.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Sarah D. Allen Oren Haynes, a portrait&quot;,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2025-03-14 19:47:00&quot;,&quot;formatted_date&quot;:&quot;June 1875&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:366},&quot;tags&quot;:[{&quot;id&quot;:74,&quot;tag&quot;:&quot;Women in higher education&quot;,&quot;created_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;updated_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:366,&quot;tag_id&quot;:74}},{&quot;id&quot;:75,&quot;tag&quot;:&quot;Women Faculty&quot;,&quot;created_at&quot;:&quot;2024-10-21 15:07:26&quot;,&quot;updated_at&quot;:&quot;2024-10-21 15:07:26&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:366,&quot;tag_id&quot;:75}}]},{&quot;id&quot;:8,&quot;year&quot;:&quot;1876&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=Emerson%20White&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/earhart,\/fa,\/epurdue,\/gilbreth,\/gougar,\/mms,\/pbuildings,\/puhistphot,\/pnewsreels,\/gwinter,\/TippeSoil,\/bottest,\/puath,\/debris,\/lesueur,\/pualumni,\/psd,\/pufaculty&amp;amp;t=a\&quot;&gt;Emerson E. White&lt;\/a&gt;&amp;nbsp;is hired as University President.&quot;,&quot;description&quot;:&quot;Under his leadership, Purdue was set firmly on its course of emphasis on agricultural and \&quot;mechanic arts\&quot; as mandated by the Morrill Act. During his tenure as president, White attempted to abolish fraternities at Purdue. The issue turned into a legal and political matter, which eventually led to his 1883 resignation. His successor, &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=smart&amp;amp;CISOFIELD1=title&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=title&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=title&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=title&amp;amp;CISOROOT=\/earhart,\/epurdue,\/gilbreth,\/gougar,\/mms,\/pbuildings,\/puhistphot,\/pnewsreels,\/TippeSoil,\/puath,\/debris,\/lesueur,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=s\&quot;&gt;James H. Smart&lt;\/a&gt;, initiated a method for formally recognizing Purdue&#039;s fraternities.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/puhistphot&amp;CISOPTR=987&amp;DMSCALE=235.29411764706&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;President Emerson E. White&quot;,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;archive_collection&quot;:&quot;puhistphot&quot;,&quot;archive_id&quot;:&quot;987&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1876&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:8},&quot;tags&quot;:[{&quot;id&quot;:8,&quot;tag&quot;:&quot;University Presidents&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:8,&quot;tag_id&quot;:8}}]},{&quot;id&quot;:268,&quot;year&quot;:&quot;1876&quot;,&quot;month&quot;:&quot;09&quot;,&quot;day&quot;:&quot;12&quot;,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/ear id&quot;:9,&quot;year&quot;:&quot;1877&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=university%20hall&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php,\/prc&amp;amp;t=a\&quot;&gt;University Hall&lt;\/a&gt;,&amp;nbsp;known as the Main Building, is completed.&quot;,&quot;description&quot;:&quot;In 1875, the Indiana legislature intervened in Purdue operations, pointing to the disorganization of the university, its poor record keeping, and high construction costs. A new Board of Trustees, comprising representatives from across the state rather than simply Tippecanoe County, halted plans on University Hall. Construction was reinitialized the following year once plans were reviewed and clarified. University Hall, then known as the Main Building, was completed in 1877. The new structure quickly became the center of most Purdue activities. Today, it remains Purdue&#039;s oldest standing building.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/UniversityHall.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;University Hall&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1877&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:9},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:9,&quot;tag_id&quot;:6}}]},{&q T=\/mms,\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;Purdue University Marching&amp;nbsp;Band&lt;\/a&gt;&amp;nbsp;is established.&quot;,&quot;description&quot;:&quot;The band started off as a part of the Purdue Student Army Training Corps and included a&amp;nbsp;drum and bugle corps. Everything from their uniforms to the necessary music had to be bought by each individual member of the band.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/pbuildings&amp;CISOPTR=732&amp;DMSCALE=187.79342723005&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Heavilon Hall (Old)&quot;,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:&quot;pbuildings&quot;,&quot;archive_id&quot;:&quot;732&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1886&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:15},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:15,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:272,&quot;year&quot;:&quot;1887&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;The &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/domestic%20economy\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;School of Domestic Economy&lt;\/a&gt; is established.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Under the direction of Emma P. Ewing, this school was open only to young women. Classes dealt with home making, cooking, bread baking, and household management. Numerous practice sessions on topics of baking, cooking, etiquette, and entertaining were embedded within the coursework.&lt;\/p&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-10-21 15:48:00&quot;,&quot;formatted_date&quot;:&quot;1887&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:272},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:272,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:273,&quot;year&quot;:&quot;1887&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The School of Civil Engineering is officially organized.&quot;,&quot;description&quot;:null,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1887&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:273},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:273,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:271,&quot;year&quot;:&quot;1887&quot;,&quot;month&quot;:&quot;10&quot;,&quot;day&quot;:&quot;09&quot;,&quot;title&quot;:&quot;Old gold and black are chosen as the colors of Purdue&#039;s&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=purdue%20football&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/puath&amp;amp;t=a&amp;amp;CISOSTART=1,21\&quot;&gt;football&lt;\/a&gt;&amp;nbsp;team.&quot;,&quot;description&quot;:&quot;In 1887, the student athletic association voted to have a football team. Only two members of the team had ever seen a game. The team paid for its own uniforms, the salary for the coach, and transportation. An athletic field did not exist on campus, and the team chose to practice in front of the Dormitory. They had one week of practice before the first and only game of the season against the more experienced team from Butler University. The day before the big event, a self-appointed committee of faculty and students met in University Hall after the team members realized that Purdue did not have distinctive team colors. Football captain John Breckenridge Burris suggested using orange and black, the colors worn by Princeton&amp;rsquo;s successful teams, but in the interest of being distinctive Old Gold was substituted for orange. The university had chosen its iconic colors. The game against Butler ended in an unceremonious 48-6 defeat; the results telegrammed to President Smart simply stated, &amp;ldquo;It&amp;rsquo;s a Waterloo.&amp;rdquo; No team formed for the 1888 season.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/puath&amp;CISOPTR=97&amp;DMSCALE=203.04568527919&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Purdue football team, 1887&quot;,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:&quot;puath&quot;,&quot;archive_id&quot;:&quot;97&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;October 9, 1887&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:271},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:271,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:16,&quot;year&quot;:&quot;1888&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;The &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=agricultural%20experiment%20station&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Agricultural Experiment Station&lt;\/a&gt; is Founded Using Hatch Act Funds.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;The U.S. Hatch Act of 1887 pledged federal funds to establish Agricultural Experiment Stations on land grant campuses. The following year Purdue created its own Experiment Station and expanded the experimental crop testing fields on campus. Undergraduate students conducted studies using this facility and published research in various pamphlets and talks to farmers. The Experiment Station still stands on campus as the Agricultural Administration Building.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1887_civil.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Civil Engineering Students&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2023-04-28 14:41:27&quot;,&quot;formatted_date&quot;:&quot;1888&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:16},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:16,&quot;tag_id&quot;:6}},{&quot;id&quot;:9,&quot;tag&quot;:&quot;College of Agriculture&quot;,&quot;created_at&quot;:&quot;2023-01-27 11:30:49&quot;,&quot;updated_at&quot;:&quot;2023-01-27 11:30:49&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:16,&quot;tag_id&quot;:9}}]},{&quot;id&quot;:17,&quot;year&quot;:&quot;1888&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;In recognition of the importance of electricity in the modern world, the&amp;nbsp;School of Electrical Engineering is officially organized.&quot;,&quot;description&quot;:&quot;Purdue moved quickly to establish a leading role in the study of electricity, and by the end of the decade a new building devoted to the study of electricity was completed. The Electrical Engineering Laboratory contained rooms for batteries, dynamos, a magnetism room, laboratories, and electrical testing rooms. George T. Ashley, class of 1891, would be the first to receive a Bachelor of Mechanical Engineering in Electrical Engineering. (That degree designation continued until 1896.)&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1888_slattery.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Slattery Alternator&quot;,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1888&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:17},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:17,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:274,&quot;year&quot;:&quot;1888&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue&#039;s first Honorary degrees are awarded to Alembert W. Brayton (Honorary Doctor of Science) and John N. Hurty (Honorary Doctor of Pharmacy).&quot;,&quot;description&quot;:null,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Alumni&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1888&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:274},&quot;tags&quot;:[{&quot;id&quot;:4,&quot;tag&quot;:&quot;Alumni&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:274,&quot;tag_id&quot;:4}}]},{&quot;id&quot;:18,&quot;year&quot;:&quot;1889&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=electrical%20engineering&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=old&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/earhart,\/epurdue,\/mms,\/pbuildings,\/puhistphot,\/pnewsreels,\/gwinter,\/TippeSoil,\/puath,\/debris,\/lesueur,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;Electrical Engineering Building&lt;\/a&gt;&amp;nbsp;is completed.&quot;,&quot;description&quot;:null,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/OldEEBuilding.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Old Electrical Engineering Building&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1889&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:18},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:18,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:276,&quot;year&quot;:&quot;1889&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue&#039;s yearbook, the&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm\/search\/searchterm\/the%20debris\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot;&gt;&lt;em&gt;Debris&lt;\/em&gt;&lt;\/a&gt;, puts out its first issue.&quot;,&quot;description&quot;:&quot;An enduring publication that ran from 1889 to 2008 was the Debris Yearbook, produced annually by the senior class. Funding for the yearbook came from subscriptions, student organizations, and advertising. Throughout its existence, the Debris shared class histories, personal stories, cartoons, school rivalries, and social activities. Pulitzer Prize winners Booth Tarkington and John T. McCutcheon contributed regularly during the formative years of the Debris. The yearbooks document otherwise&amp;nbsp;unrecorded histories of the university from the student perspective.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1889&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:276},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:276,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:275,&quot;year&quot;:&quot;1889&quot;,&quot;month&quot;:&quot;12&quot;,&quot;day&quot;:&quot;15&quot;,&quot;title&quot;:&quot;&lt;p&gt;The first issue of the student newspaper, &lt;em&gt;The&amp;nbsp;Exponent,&lt;\/em&gt;&amp;nbsp;is published.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;The original student newspaper of the 1870s, &lt;em&gt;The Purdue&lt;\/em&gt;, had a short life but was revived in the fall of 1882 as a monthly publication. This new &lt;em&gt;Purdue&lt;\/em&gt; was a combined effort of the Irving, Philalethean, and Carlyle literary societies. The content involved short literary, scientific, and engineering pieces; poems; and campus news from departments, clubs, and literary societies. The publication continued until the spring of 1888, when tensions between the faculty and student staff led to its demise. The Purdue &lt;em&gt;Exponent&lt;\/em&gt; followed in December, 1889, as a monthly publication. Much like the earlier student news publications, the first issue contained features concerning news, sports, the literary societies, departmental activities, and essays. Agnes Eugenie Vater served as the founding editor, while Helen Golden and Laura Burton took on the roles of exchange editor and local editor, respectively. The &lt;em&gt;Exponent&lt;\/em&gt; has been a key source in learning about undergraduate research involvement. It became independent of the university in 1965 and is now owned by the not-for-profit Purdue Student Publishing Foundation.&lt;\/p&gt;&lt;p&gt;&amp;nbsp;&lt;\/p&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2025-06-16 19:51:36&quot;,&quot;formatted_date&quot;:&quot;December 15, 1889&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:275},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:275,&quot;tag_id&quot;:7}},{&quot;id&quot;:74,&quot;tag&quot;:&quot;Women in higher education&quot;,&quot;created_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;updated_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:275,&quot;tag_id&quot;:74}}]},{&quot;id&quot;:19,&quot;year&quot;:&quot;1890&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Purdue&#039;s first seal is created by book designer, typographer, and Purdue graduate Bruce Rogers.&quot;,&quot;description&quot;:&quot;The seal was never officially recognized by the University and it would take several more designs before Purdue officially adopted a seal.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1890-seal-b.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;First Seal&quot;,&quot;tag&quot;:&quot;Administration&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1890&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:19},&quot;tags&quot;:[{&quot;id&quot;:2,&quot;tag&quot;:&quot;Administration&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:19,&quot;tag_id&quot;:2}}]},{&quot;id&quot;:450,&quot;year&quot;:&quot;1890&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;George W. Lacey becomes the first African American graduate of Purdue.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;George W. Lacy, or Lacey, completed a degree in pharmacy, becoming the first African American graduate of Purdue. At the time, Pharmacy was an academic organization separate from the university, and as a result, Lacy\u2019s success is sometimes overlooked.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/HjUaHBGXPp8YcB28C03VsMqxEd1Hoj01amQjhww9.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Head and shoulders portrait of young man in a suit.&quot;,&quot;tag&quot;:null,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:&quot;2021-01-28 14:52:03&quot;,&quot;updated_at&quot;:&quot;2021-01-28 18:41:57&quot;,&quot;formatted_date&quot;:&quot;1890&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:450},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:450,&quot;tag_id&quot;:1}},{&quot;id&quot;:4,&quot;tag&quot;:&quot;Alumni&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:450,&quot;tag_id&quot;:4}},{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:450,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:20,&quot;year&quot;:&quot;1891&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;An 85,000 Pound Schenectady No. 1 Locomotive Engine is Purchased.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;The University\u2019s connection to the railroad industry was affirmed with the construction of the Engineering Laboratory in 1890-91. Among the many engines, testing machines, and other apparatus was an 85,000-pound Schenectady locomotive. The massive engine was placed inside the new laboratory and mounted on supporting wheels, hence its performance could be studied while the engine was going at various speeds, loads, and conditions. Testing became an integral aspect of university education and undergraduate student research. Later in the decade, that original Schenectady locomotive was replaced by the Schenectady No. 2.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1891_schenectady.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Schenectady Locomotive&quot;,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2023-04-28 14:42:00&quot;,&quot;formatted_date&quot;:&quot;1891&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:20},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:20,&quot;tag_id&quot;:1}},{&quot;id&quot;:10,&quot;tag&quot;:&quot;College of Engineering&quot;,&quot;created_at&quot;:&quot;2023-01-27 11:31:40&quot;,&quot;updated_at&quot;:&quot;2023-01-27 11:31:40&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:20,&quot;tag_id&quot;:10}}]},{&quot;id&quot;:277,&quot;year&quot;:&quot;1891&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/compoundobject\/collection\/theses\/id\/5785\/rec\/5\&quot;&gt;Guilford Lawson Spencer&lt;\/a&gt; earns the first doctorate (Doctorate of Science) from Purdue University.&quot;,&quot;description&quot;:&quot;Spencer&#039;s dissertation studied the consumption of tea in the United States and the ways in which commerically avaliable tea was tampered with in order to cheat consumers.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1891&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:277},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:277,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:367,&quot;year&quot;:&quot;1891&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The \&quot;Boilermakers\&quot; title is adopted for the Purdue sports teams.&quot;,&quot;description&quot;:&quot;On October 24, 1891, the Purdue football team played its season opener against Wabash College. Over the course of the game, Purdue was accused of multiple underhanded tactics, including the selection of recently graduated Purdue team captain Robert Allen Lackey as referee and the use of iron cleats on their shoes. Ultimately eight Wabash players left the field due to injuries, some caused by Purdue&amp;rsquo;s cleats, and Purdue won the 40-minute-long game 44 to 0. Afterwards, the Crawfordsville newspaper reported that the game had been a &amp;ldquo;slaughter of the innocents&amp;rdquo; and Wabash had been &amp;ldquo;snowed completely under by the burly boiler makers from Purdue.&amp;rdquo; Though intended as an insult, Purdue embraced the nickname and the team has ever since been known as Boilermakers.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/puath&amp;CISOPTR=405&amp;DMSCALE=189.57345971564&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Purdue football team, 1892&quot;,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:&quot;puath&quot;,&quot;archive_id&quot;:&quot;405&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1891&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:367},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:367,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:21,&quot;year&quot;:&quot;1894&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Purdue&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=tank%20scrap&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;\&quot;Tank Scrap\&quot;&lt;\/a&gt; tradition is born.&quot;,&quot;description&quot;:&quot;&lt;div&gt;In late 1894, a fifty-foot-high water tank was installed on North Salisbury Street. The tank quickly became a target of graffiti artists, including students, who painted their class graduation year on the tank. Painting the tank quickly became a subject of inter-class fighting; these combative physical battles lead to the establishment of an annual &amp;ldquo;scrap&amp;rdquo; between male freshmen and sophomores to determine which graduation class year would appear on the tank. At its height, up to 10,000 people would gather to watch the spectacle. In some years, the brawl lasted a couple of hours and in others, as little as twenty-five minutes. Once the upperclassmen declared the winning class, the victors were clear to emblazon the tank with their graduation year. The winning class then painted the losing side, decorated them with corn stalks, and marched them chained and defeated into downtown Lafayette. In 1901, weapons and the use of fists were officially banned.&lt;\/div&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1901tankscrap.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Tank Scrap&quot;,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1894&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:21},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_i  classrooms, a museum, and a boiler room. It would house the Mechanical Engineering, Civil Engineering, and Practical Mechanics Departments.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/pbuildings&amp;CISOPTR=724&amp;DMSCALE=187.79342723005&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Heavilon Hall (Old)&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:&quot;pbuildings&quot;,&quot;archive_id&quot;:&quot;724&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;January 19, 1894&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:449},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:449,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:278,&quot;year&quot;:&quot;1894&quot;,&quot;month&quot;:&quot;01&quot;,&quot;day&quot;:&quot;23&quot;,&quot;title&quot;:&quot;The newly built Heavilon Hall is destroyed in a fire.&quot;,&quot;description&quot;:&quot;&lt;div&gt;Four days after its dedication, a fire broke out in the boiler room. Students, staff, faculty, and neighbors ran into the building and removed whatever machinery and furniture they could. By the time fire brigades arrived, much of the three-story building was beyond saving. Only a portion of the building containing the foundry and wood shops was left standing. &lt;br \/&gt;The following morning&amp;nbsp;President Smart addressed the student body:&lt;\/div&gt;\n&lt;div&gt;&amp;ldquo;We are looking this morning to the future, not to the past. I am thankful that no one was injured&amp;hellip;But I tell you young men that tower shall go up one brick higher.&amp;rdquo;&amp;nbsp;&lt;\/div&gt;\n&lt;div&gt;The rebuilt Heavilon Hall tower was built nine ada,\/php&amp;amp;t=a\&quot;&gt;train wreck&lt;\/a&gt;&amp;nbsp;while on their way to Indianapolis to play Indiana University.&quot;,&quot;description&quot;:&quot;&lt;div&gt;President Winthrop Stone and his family, along with students, faculty, staff, and townspeople were among those on the Purdue Special. As the fourteen-car train rounded a curve in northwest Indianapolis it plunged into a coal train backing up on the same tracks. Seventeen people were killed. Hundreds were injured. Within weeks there were calls for a memorial gymnasium to honor the victims. In late November President Stone published a formal call for contributions. Donations arrived from hundreds of Purdue alumni, faculty, staff, students, and the surrounding community. The Memorial Gymnasium was dedicated May 29, 1909, with state-of-the-art facilities, a swimming pool, and reportedly the first glass backboards of any university basketball facility. (The structure was renamed Felix Haas Hall in 2006.) In memory of those lost, seventeen steps lead up to the main entrance.&lt;\/div&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/PurdueTrainWreck.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;1903 Purdue Train Wreck&quot;,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1903&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:28},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:28,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:29,&quot;year&quot;:&quot;1905&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;The Department of Household Economics is established.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;The department was establish P4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings&amp;amp;t=a\&quot;&gt;Wetherill Laboratory of Chemistry&lt;\/a&gt;, the&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=engineering&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=agricultural%20biological&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings&amp;amp;t=a\&quot;&gt;Agricultural and Biological Engineering Building&lt;\/a&gt;, and the &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/collection\/ag-ed!epurdue!earhart!bcc!bot!cl!ua25!debris!msa291!theses!engext!AESAgSciDig!AES_AR!AESBulletin!AESCircular!AESecon!AESclsum!AESCrops!AESLeaflet!AESMimeo4H!AESMimeoAE!AESMimeoAS!AESMimeoAY!AESmime&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/NewEEBuilding.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Electrical Engineering Building&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1923&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:41},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:41,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:42,&quot;year&quot;:&quot;1924&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Purdue Memorial Union is completed.&quot;,&quot;description&quot;:&quot;&lt;div&gt;The Union was first proposed during the early 1910s, but efforts were postponed due to World War I. After the war, the students sought a new building to serve not only as a center of campus activity but also a tribute to all those who had served during the war. Students and alumni spent months raising funds and implored their classmates to contribute to the Union fund with large signs on campus. Enough funds were gathered to begin construction in 1922 and a groundbreaking ceremony took place during Gala Week in June. Alumnus David Ross, at that time a university trustee, laid the cornerstone for the building on November 25, 1922, in a ceremony attended by Indiana&amp;rsquo;s Governor Warren T. McCray. Fundraising continued throughout the building&amp;rsquo;s construction, which was occasionally delayed due to funding issues. The building officially opened on September 9, 1924, quickly becoming the center of student activity on campus. It has been expanded and renovated multiple times.&lt;\/div&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/PurdueMemorialUnion.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Purdue Memorial Union&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1924&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:42},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:42,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:294,&quot;year&quot;:&quot;1924&quot;,&quot;month&quot;:&quot;06&quot;,&quot;day&quot;:&quot;24&quot;,&quot;title&quot;:&quot;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=ross-ade%20stadium&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings&amp;amp;t=a\&quot;&gt;Ross-Ade Stadium&lt;\/a&gt;&amp;nbsp;is completed.&quot;,&quot;description&quot;:&quot;Trustee &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=david%20ross&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a&amp;amp;CISOSTART=1,1\&quot;&gt;David Ross&lt;\/a&gt; led the effort to build a new stadium for Purdue and worked with noted alumnus &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=george%20ade&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;George Ade&lt;\/a&gt; to raise the funds. They established the Ross-Ade Foundation to oversee fundraising for the new stadium, mainly through the sale of $200 lifetime memberships purchased by alumni. Construction began once enough funds had been raised. Upon completion, Ross-Ade Stadium had a seating capacity of 13,500.&amp;nbsp;The football team began practicing in the new stadium in early November and played their first Homecoming game there against Indiana University&amp;nbsp;on November 22, 1924.&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/pbuildings&amp;CISOPTR=1246&amp;DMSCALE=203.73514431239&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Ross-Ade Stadium&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:&quot;pbuildings&quot;,&quot;archive_id&quot;:&quot;1246&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;June 24, 1924&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:294},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:294,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:43,&quot;year&quot;:&quot;1925&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=old%20oaken%20bucket&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/puhistphot,\/pnewsreels,\/puath,\/debris,\/pualumni,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot;&gt;\&quot;Old Oaken Bucket\&quot;&lt;\/a&gt; football trophy is first introduced.&quot;,&quot;description&quot;:&quot;The bucket was intended to be given annually to the winner of the Purdue-Indiana&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=purdue%20football&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/puath&amp;amp;t=a&amp;amp;CISOSTART=1,21\&quot;&gt;football&lt;\/a&gt;&amp;nbsp;game. The teams had played an annual rivalry game since 1891, but the introduction of the Old Oaken Bucket, a trophy that represented the shared agricultural heritage of both Indiana schools, sparked even greater interest in the annual game. The Old Oaken Bucket became an emblem for the Purdue football team even outside the annual game against Indiana. Its image could be found on promotional materials for Purdue Athletics and on tickets to football games.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/OldOakenBucket.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Old Oaken Bucket&quot;,&quot;tag&quot;:&quot;Athletics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1925&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:43},&quot;tags&quot;:[{&quot;id&quot;:5,&quot;tag&quot;:&quot;Athletics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:43,&quot;tag_id&quot;:5}}]},{&quot;id&quot;:295,&quot;year&quot;:&quot;1926&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;The Department of Household Economics, established in 1905, expands and becomes the &lt;a href=\&quot;https:\/\/archives.lib.purdue.edu\/agents\/corporate_entities\/1001\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;School of Home Economics&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Mary L. Matthews became the first dean of the School, which included five departments: Foods and Nutrition, Clothing and Textiles, Applied Art, Institution Management, and Home Administration. She served as dean until her retirement in 1952 and in 1976, the Home Economics Building was renamed &lt;a href=\&quot;https:\/\/www.purdue.edu\/hhs\/news\/2022\/03\/matthews-hall-celebrates-100-years-of-history-and-memories\/\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Matthews Hall&lt;\/a&gt; in her honor. That same year, the School transitioned to the College of Consumer and Family Sciences, significantly increasing enrollment among male students.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/eTaNdMcFSLOw0hc2kXntxiAazcQ8GnU0LbLd009h.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Portrait of Mary Matthews and Home Economics students in class&quot;,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2025-03-11 18:39:38&quot;,&quot;formatted_date&quot;:&quot;1926&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:295},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:295,&quot;tag_id&quot;:1}},{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:295,&quot;tag_id&quot;:6}},{&quot;id&quot;:74,&quot;tag&quot;:&quot;Women in higher education&quot;,&quot;created_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;updated_at&quot;:&quot;2024-10-21 14:36:06&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:295,&quot;tag_id&quot;:74}},{&quot;id&quot;:75,&quot;tag&quot;:&quot;Women Faculty&quot;,&quot;created_at&quot;:&quot;2024-10-21 15:07:26&quot;,&quot;updated_at&quot;:&quot;2024-10-21 15:07:26&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:295,&quot;tag_id&quot;:75}}]},{&quot;id&quot;:44,&quot;year&quot;:&quot;1928&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;Franklin Levering &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=cary&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings&amp;amp;t=a&amp;amp;CISOSTART=1,1\&quot;&gt;Cary Memorial Hall&lt;\/a&gt;&amp;nbsp;opens.&quot;,&quot;description&quot;:&quot;Frank and Jessie Levering Cary of Lafayette donated $50,000 to build the dormitory in memory of their son, Franklin&amp;nbsp;Levering Cary, who died suddenly of appendicitis shortly before his anticipated college enrollment date in 1912. Cary, later known as Cary Quadrangle, became the first men&amp;rsquo;s residence building on campus since the Men&amp;rsquo;s Dormitory was renovated into classroom space in 1902.&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/CaryQuadrangle.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Cary Quadrangle&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1928&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:44},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:44,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:296,&quot;year&quot;:&quot;1929&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The Purdue Graduate School is officially established.&quot;,&quot;description&quot;:null,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1929&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:296},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:296,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:377,&quot;year&quot;:&quot;1930&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;Early Graduate in Aeronautical Engineering&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Ralph Johnson, one of the nation\u2019s earliest graduates in aeronautical engineering, would later go on to develop safe landing procedures for pilots amidst blackout conditions during WWII and patent several designs that contributed towards air safety.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/media\/wOuz7QIgv9bqxEbDeMHmLBcNcmwoUB4e0APs2yyJ.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Ralph Johnson&quot;,&quot;tag&quot;:&quot;Alumni&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-09-14 20:03:03&quot;,&quot;formatted_date&quot;:&quot;1930&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:377},&quot;tags&quot;:[{&quot;id&quot;:3,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:377,&quot;tag_id&quot;:3}},{&quot;id&quot;:26,&quot;tag&quot;:&quot;Alumnus&quot;,&quot;created_at&quot;:&quot;2024-09-10 21:34:01&quot;,&quot;updated_at&quot;:&quot;2024-09-10 21:34:01&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:377,&quot;tag_id&quot;:26}},{&quot;id&quot;:29,&quot;tag&quot;:&quot;Inventor&quot;,&quot;created_at&quot;:&quot;2024-09-10 21:40:22&quot;,&quot;updated_at&quot;:&quot;2024-09-10 21:40:22&quot;,&quot;pivot&quot;:{&quot;event_id&quot;:377,&quot;tag_id&quot;:29}}]},{&quot;id&quot;:45,&quot;year&quot;:&quot;1930&quot;,&quot;month&quot;:&quot;11&quot;,&quot;day&quot;:null,&quot;title&quot;:&quot;The&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=purdue%20university%20airport&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings,\/earhart,\/epurdue&amp;amp;t=a\&quot;&gt;Purdue University Airport&lt;\/a&gt;&amp;nbsp;is established.&quot;,&quot;description&quot;:&quot;&lt;div&gt;Purdue became the first U.S. university to offer college credit for flight training in 1930. President of the Board of Trustees, David Ross, gave the University the land needed to establish an airport.&amp;nbsp;&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;Purdue University Airport first appeared on U.S. government airway maps in 1930. Since its inception, it has been more than a landing strip and decidedly more than an airport. The Purdue Airport has always been and continues to be a classroom of hangars, machine shops, research laboratories, a control tower, tarmac, and sky.&lt;\/span&gt;&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;&amp;nbsp;&lt;\/span&gt;&lt;\/div&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/1930_airport.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Purdue University Airport&quot;,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;November 1930&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:45},&quot;tags&quot;:[{&quot;id&quot;:3,&quot;tag&quot;:&quot;Aeronautics and Astronautics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:45,&quot;tag_id&quot;:3}}]},{&quot;id&quot;:297,&quot;year&quot;:&quot;1930&quot;,&quot;month&quot;:&quot;12&quot;,&quot;day&quot;:&quot;30&quot;,&quo Delia Silance and Ella Belle Silance become the first known African American women to graduate from Purdue, earning Bachelor of Science degrees.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Both women were listed as Distinguished Students in the 1932 Debris yearbook, under their senior photos. The sisters were from Lafayette and Delia earned a scholarship to attend Purdue.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/W5McK6zfPhywApGhKZjpMGqxsNeK3QLGbuLfKZXi.jpeg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Delia and Ella Silance, 1932&quot;,&quot;tag&quot;:&quot;Alumni&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2025-02-25 14:13:52&quot;,&quot;formatted_date&quot;:&quot;1932&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:376},&quot;tags&quot;:[{&quot;id&quot;:4,&quot;tag&quot;:&quot;Alumni&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:376,&quot;tag_id&quot;:4}}]},{&quot;id&quot;:379,&quot;year&quot;:&quot;1933&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The first Purdue Christmas Show is held.&quot;,&quot;description&quot;:&quot;The first show was not the huge success as Al Stewart, director of the music programs, had hoped in its first year but word about the quality of the show quickly spread and it became so popular that it outgrew Fowler Hall. President Elliott requested federal support for the creation of a music hall, receiving funds to build a state-of-the-art theater.&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Student Life&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;formatted_date&quot;:&quot;1933&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:379},&quot;tags&quot;:[{&quot;id&quot;:7,&quot;tag&quot;:&quot;Student Life&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:379,&quot;tag_id&quot;:7}}]},{&quot;id&quot;:47,&quot;year&quot;:&quot;1934&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;&lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings\/searchterm\/South%20Hall!duhme%20hall\/field\/all!all\/mode\/all!all\/conn\/or!and\/order\/nosort\/ad\/asc\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;South Hall&lt;\/a&gt;, now known as Duhme Hall, is finished.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Duhme Hall was the first of the buildings which make up &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings\/searchterm\/windsor\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Windsor Halls&lt;\/a&gt; to be completed. The remaining four were completed over the next two decades. &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings\/searchterm\/shealy%20hall!north%20hall\/field\/all!all\/mode\/all!all\/conn\/or!and\/order\/nosort\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Shealy Hall&lt;\/a&gt;, originally North Hall, was finished in 1937, followed by &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings\/searchterm\/wood%20hall\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Wood Hall&lt;\/a&gt; in 1939, and finally &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings\/searchterm\/warren%20hall\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Warren Hall&lt;\/a&gt; and &lt;a href=\&quot;http:\/\/e-archives.lib.purdue.edu\/cdm\/search\/collection\/pbuildings\/searchterm\/vawter%20hall\/field\/all\/mode\/all\/conn\/and\/order\/date\/ad\/asc\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Vawter Hall&lt;\/a&gt; in 1951. Winsdor is Purdue&#039;s oldest women&#039;s residence and has housed many distinguished Purdue women including Amelia Earhart, Dr. Lillian Gilbreth, and most recently astronaut Janice Voss.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;https:\/\/earchives.lib.purdue.edu\/utils\/ajaxhelper\/?CISOROOT=\/pbuildings&amp;CISOPTR=1199&amp;DMSCALE=203.04568527919&amp;DMWIDTH=1200&amp;DMHEIGHT=1200&amp;DMX=0&amp;DMY=0&amp;DMROTATE=0&amp;action=2&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Two women in dorm room&quot;,&quot;tag&quot;:&quot;Buildings&quot;,&quot;archive_collection&quot;:&quot;pbuildings&quot;,&quot;archive_id&quot;:&quot;1199&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-12-06 18:33:30&quot;,&quot;formatted_date&quot;:&quot;1934&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:47},&quot;tags&quot;:[{&quot;id&quot;:6,&quot;tag&quot;:&quot;Buildings&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:47,&quot;tag_id&quot;:6}}]},{&quot;id&quot;:48,&quot;year&quot;:&quot;1935&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;&lt;p&gt;Two distinguished women, aviator &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=amelia%20earhart&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/epurdue,\/puhistphot,\/pnewsreels,\/debris,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Amelia Earhart&lt;\/a&gt; and industrial engineer &lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=lillian%20gilbreth&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/puhistphot,\/pnewsreels,\/debris,\/psd,\/pufaculty,\/pada,\/php&amp;amp;t=a\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;&gt;Lillian Gilbreth&lt;\/a&gt;, join the staff of the University.&lt;\/p&gt;&quot;,&quot;description&quot;:&quot;&lt;p&gt;Interested in helping to address the demands of the growing female student population, President Elliott hired two women with international reputations in 1935: Amelia Earhart and Lillian Gilbreth. Elliott believed that the professional achievements of Earhart and Gilbreth would serve as role models for women students in seeking careers following graduation. Earhart, a widely recognized pilot who encouraged women to fly, was hired to serve a dual role as technical adviser in aeronautics and as careers counselor for women students. Gilbreth, a pioneer in motion study alongside her husband and business partner, Frank, was a highly respected leader in the traditionally male professions of engineering and industry.&lt;\/p&gt;&quot;,&quot;media_url&quot;:&quot;\/storage\/puhistorical\/GilbrethandEarhart.jpg&quot;,&quot;media_type&quot;:&quot;image&quot;,&quot;media_description&quot;:&quot;Lillian Gilbreth and Amelia Earhart&quot;,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-12-06 18:51:52&quot;,&quot;formatted_date&quot;:&quot;1935&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:48},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot; er communities, large or small, urban or rural, they may be placed after college.\u201d&amp;nbsp;The intent of the experiment was to create a plan of study that accentuated math and science courses as a subject of inquiry and knowledge, rather than as the foundation of technical or vocational training. This approach provided an alternative path for women interested in pursuing an education in traditionally male dominated departments like engineering or agriculture as well as newer courses situated in the social sciences and humanities.&amp;nbsp;One alumna recalled, \u201cwhile statistics said that somewhere around 95% of us would marry and stay home to rear our children, the Liberal Science environment told us we were valuable citizens and just as important to society as any man on the engineering campus.\u201d&lt;\/p&gt;&quot;,&quot;media_url&quot;:null,&quot;media_type&quot;:null,&quot;media_description&quot;:null,&quot;tag&quot;:&quot;Academics&quot;,&quot;archive_collection&quot;:null,&quot;archive_id&quot;:null,&quot;created_at&quot;:null,&quot;updated_at&quot;:&quot;2024-12-10 16:54:51&quot;,&quot;formatted_date&quot;:&quot;1939&quot;,&quot;pivot&quot;:{&quot;timeline_id&quot;:1,&quot;event_id&quot;:378},&quot;tags&quot;:[{&quot;id&quot;:1,&quot;tag&quot;:&quot;Academics&quot;,&quot;created_at&quot;:null,&quot;updated_at&quot;:null,&quot;pivot&quot;:{&quot;event_id&quot;:378,&quot;tag_id&quot;:1}}]},{&quot;id&quot;:302,&quot;year&quot;:&quot;1940&quot;,&quot;month&quot;:null,&quot;day&quot;:null,&quot;title&quot;:&quot;The&amp;nbsp;&lt;a href=\&quot;http:\/\/earchives.lib.purdue.edu\/cdm4\/results.php?CISOOP1=all&amp;amp;CISOBOX1=chemical%20engineering&amp;amp;CISOFIELD1=CISOSEARCHALL&amp;amp;CISOOP2=exact&amp;amp;CISOBOX2=&amp;amp;CISOFIELD2=CISOSEARCHALL&amp;amp;CISOOP3=any&amp;amp;CISOBOX3=&amp;amp;CISOFIELD3=CISOSEARCHALL&amp;amp;CISOOP4=none&amp;amp;CISOBOX4=&amp;amp;CISOFIELD4=CISOSEARCHALL&amp;amp;CISOROOT=\/pbuildings&amp;amp;t=a\&quot;&gt;Chemical Eng
